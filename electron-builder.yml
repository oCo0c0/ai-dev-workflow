# electron-builder 三平台打包配置
#
# 关键点：
# - asar: false —— resources/pi-extensions 等需被后端派生的孙进程（pi RPC 子进程）
#   按真实文件路径读取，asar 归档内的路径对普通 fs 不可见
# - files 覆盖运行时所需的应用代码；生产依赖（node_modules）由 electron-builder 自动打入
# - 产物输出到 release/（不入库）
#
# 构建命令：pnpm dist:win / dist:mac / dist:linux
# 说明：macOS 目标建议在 macOS 主机构建（签名/公证需要 Apple 开发者账号）；
#       本仓库暂出未签名产物，正式分发前补 CI 签名流程。

appId: com.along.ai-dev-workbench
productName: AI Dev Workbench
copyright: Copyright © along
# 可执行文件名：package.json 的 name 是 scope 包名(@along/ai-dev-workbench)，
# 含 @ 无法用作文件路径，显式指定安全的可执行文件名
executableName: ai-dev-workbench

directories:
  output: release
  buildResources: build

asar: false
compression: maximum

files:
  - dist/**
  - dist-electron/**
  - resources/**
  - templates/**
  - skills/**
  - package.json
  # BYO-CLI：AI 引擎平台二进制不随包分发（约 500MB），运行时回退系统安装的
  # claude / codex（claude-bridge.resolveClaudeCliPath / codex-provider.createClient）
  - '!node_modules/@anthropic-ai/claude-agent-sdk-win32-*/**'
  - '!node_modules/@anthropic-ai/claude-agent-sdk-darwin-*/**'
  - '!node_modules/@anthropic-ai/claude-agent-sdk-linux-*/**'
  - '!node_modules/@openai/codex-win32-*/**'
  - '!node_modules/@openai/codex-darwin-*/**'
  - '!node_modules/@openai/codex-linux-*/**'

win:
  # nsis：标准安装器（写 HKCU 卸载信息，Add/Remove Programs 可见——Windows 标准，
  #   与 orca/VS Code 用户级安装一致）；portable：单文件绿色版，零安装零注册表
  target:
    - nsis
    - portable

portable:
  artifactName: ${productName}-${version}-portable.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-setup.${ext}

mac:
  target:
    - dmg
  category: public.app-category.developer-tools

linux:
  target:
    - AppImage
    - deb
  category: Development
  artifactName: ${productName}-${version}-${arch}.${ext}
  # 用 productName 生成 .desktop 消除 desktopName 未设置警告
  syncDesktopName: true
