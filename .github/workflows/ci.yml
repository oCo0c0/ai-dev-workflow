# 持续集成：push/PR 时跑类型检查、单元测试和构建，防回归
# 与 release.yml 互相独立——一个管质量门禁，一个管发版

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm run build && pnpm run build:electron
