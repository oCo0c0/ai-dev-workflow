# 版本发布工作流：推送 v* tag 自动构建三平台安装包并发布到 GitHub Releases
#
# 用法：
#   1. 更新 package.json 的 version 并提交
#   2. git tag v0.x.0 && git push origin v0.x.0
#   3. Actions 构建完成后，安装包出现在对应 tag 的 Release 页
#
# 说明：
# - mac 打包必须在 macOS 主机（签名/公证同理），故用 matrix 分平台构建
# - 发布分两阶段：各平台只上传 artifact，最后由 release job 统一创建 Release——
#   避免 3 个 job 并发写同一 Release 的资产竞态（delete-a-release-asset 404）
# - 构建步骤注入 GH_TOKEN：认证后 GitHub 下载限额从 60/h 提升到 1000/h
# - 产物未签名，Win 会弹 SmartScreen、mac 需右键打开；正式分发前需补签名

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache electron binaries
        uses: actions/cache@v4
        with:
          key: electron-${{ runner.os }}-39.8.10
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache

      - name: Build and package
        # --publish never：发布统一由 release job 上传，禁用 electron-builder 内置发布
        # unix 平台先抬高文件句柄上限（macOS 默认 256，打包大量文件会 EMFILE）
        # 显式用 bash 执行：Windows runner 默认 pwsh，不识别 bash 语法；
        # retry 包装：下载 GitHub 二进制偶发触发限流，自动重试
        uses: nick-fields/retry@v3
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          max_attempts: 3
          retry_on: error
          timeout_minutes: 30
          shell: bash
          command: |
            if [ "$RUNNER_OS" != "Windows" ]; then ulimit -n 10240; fi
            cd "$GITHUB_WORKSPACE"
            pnpm run build
            pnpm run build:electron
            pnpm exec electron-builder ${{ matrix.args }} --publish never

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # 先删旧 Release 再重建：保证资产幂等，不被上一次运行的残留污染
      - name: Delete stale release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --yes || true

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/*.AppImage
            artifacts/*.deb
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
