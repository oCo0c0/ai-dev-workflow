# dsh-adw bundle patch: inserts the dual-face plugin row into the web profile
# roster. Applied as a profile bundle layer (the `dsh.bundle.patch` manifest
# field) over dsh-base; install with
# `dsh plugin --profile web add link:<repo>/packages/dsh-adw`.
#
# The row is a bare plugin by package name: the node half (exports ".") runs in
# the host process (requirement engine + /api/dsh-adw routes + agent tools +
# system-prompt announcement), and the `dsh.client` declaration in package.json
# makes the browser half (exports "./client", served at
# /plugins/ui-dsh-adw/client.js) load in the web GUI.
- insert:
    - id: ui-dsh-adw
      name: '@along/dsh-adw'
